services:
  valkey:
    image: valkey/valkey:9.1.2
    ports:
      - "6379:6379"
  angos:
    image: ghcr.io/project-angos/angos:main
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/config.toml
      # The image runs as UID 65534: `chown -R 65534:65534 data` first.
      - ./data:/data
    environment:
      RUST_LOG: "info"
    command:
      - server
