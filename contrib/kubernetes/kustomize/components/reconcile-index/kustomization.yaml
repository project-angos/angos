---
# Schedules `angos reconcile index` daily. Pair it with an index policy,
# [global.index] or a repository's `index` table, in base/config.toml;
# without one the run only reclaims the listings on-demand opens created.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - cronjob.yaml
