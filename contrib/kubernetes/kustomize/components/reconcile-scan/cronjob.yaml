---
# Report refresh, daily at 04:00, away from the hourly prune and scrub slots.
# It enqueues a scan for every image without a report, and for every image
# whose newest report the [global.scan.refresh] or repository scan.refresh
# rules find due; the server or a worker drains the jobs. Include this
# component once [global.scan] is configured. A run that finds nothing due
# enqueues nothing, so a daily schedule costs one read per image.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: angos-reconcile-scan
  namespace: angos
  labels:
    app: angos
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: angos
            job: reconcile-scan
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile-scan
              # The same tag as the Deployment, for the reason given there.
              image: ghcr.io/project-angos/angos:1.8.0
              args:
                - -c
                - /config/config.toml
                - -c
                - /credentials/secrets.toml
                - reconcile
                - scan
              env:
                # The job log is the only record of what the run enqueued.
                - name: RUST_LOG
                  value: info
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: angos-config
            - name: credentials
              secret:
                secretName: angos-credentials
