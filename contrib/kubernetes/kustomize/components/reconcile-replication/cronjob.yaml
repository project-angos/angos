---
# Replication reconciliation, daily at 03:00, away from the hourly prune and
# scrub slots. It enqueues a push for every tag a downstream lacks or holds at
# another digest, and a delete for every downstream-only tag of a
# prune = true downstream, then drains those jobs before exiting. Include
# this component once a [[repository."<name>".downstream]] is configured;
# the event path already replicates every write, this catches what it missed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: angos-reconcile-replication
  namespace: angos
  labels:
    app: angos
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: angos
            job: reconcile-replication
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile-replication
              # The same tag as the Deployment, for the reason given there.
              image: ghcr.io/project-angos/angos:1.8.0
              args:
                - -c
                - /config/config.toml
                - -c
                - /credentials/secrets.toml
                - reconcile
                - replication
              env:
                # The job log is the only record of what the run enqueued.
                - name: RUST_LOG
                  value: info
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: angos-config
            - name: credentials
              secret:
                secretName: angos-credentials
