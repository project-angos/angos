---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angos
  namespace: angos
spec:
  rules:
    - host: cr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angos
                port:
                  number: 8000
  tls:
    - hosts:
        - cr.example.com
# /healthz, /readyz and /metrics are admitted unauthenticated by the access
# policy, for the kubelet and an in-cluster scraper. Keep them off this host
# with your controller's own means, as the gateway-api overlay does with a
# redirect rule.
