---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angos
  namespace: angos
  annotations:
    ingress.cilium.io/tls-passthrough: "enabled"
    ingress.cilium.io/force-https: "true"
    # The nginx controller must run with --enable-ssl-passthrough.
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  rules:
    - host: cr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angos
                port:
                  number: 8000
  tls:
    - hosts:
        - cr.example.com
