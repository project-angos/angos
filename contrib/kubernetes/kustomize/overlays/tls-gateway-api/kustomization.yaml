---
# TLS terminated by the registry itself, passed through a Gateway by SNI, with a
# client CA for mTLS policies. Expects a `server-tls-certificate` Secret of
# type kubernetes.io/tls and a `client-ca` Secret carrying `ca.crt` in the
# namespace. Before applying, edit base/config.toml and fill
# base/credentials-secret.yaml; the README lists what to change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - tlsroute.yaml

# components:
#   - ../../components/kubernetes-oidc
#   - ../../components/kubelet-credential-provider

configMapGenerator:
  - name: angos-config
    behavior: merge
    files:
      - tls.toml
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: angos
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: tls
          secret:
            secretName: server-tls-certificate
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: client-ca
          secret:
            secretName: client-ca
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: tls
          mountPath: /tls
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: client-ca
          mountPath: /client-ca
          readOnly: true
      # A third configuration file, inserted before the subcommand.
      - op: add
        path: /spec/template/spec/containers/0/args/4
        value: -c
      - op: add
        path: /spec/template/spec/containers/0/args/5
        value: /config/tls.toml
      # The kubelet probes over TLS without verifying the certificate.
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/scheme
        value: HTTPS
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/scheme
        value: HTTPS
