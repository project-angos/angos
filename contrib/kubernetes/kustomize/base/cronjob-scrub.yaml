---
# Storage integrity check, hourly at :45, after the prune at :15 so it reclaims
# what that run just unreferenced. It walks the bucket's metadata and blobs
# directly rather than through the server, which is why it mounts both
# configuration files exactly as the Deployment does.
#
# A key matching no known layout is moved to _lost_and_found/ for inspection.
# --delete-unknown removes such keys outright instead; only add it while this
# tag matches the Deployment's exactly, and after a dry run (-d) following any
# upgrade, since a changed layout makes the old shapes unknown.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: angos-scrub
  namespace: angos
  labels:
    app: angos
spec:
  schedule: "45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: angos
            job: scrub
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scrub
              image: ghcr.io/project-angos/angos:1.8.0
              args:
                - -c
                - /config/config.toml
                - -c
                - /credentials/secrets.toml
                - scrub
              env:
                # Without this the run is nearly silent.
                - name: RUST_LOG
                  value: info
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: angos-config
            - name: credentials
              secret:
                secretName: angos-credentials
