---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: angos

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - credentials-secret.yaml
  - deployment.yaml
  - service.yaml
  - cronjob-prune.yaml
  - cronjob-scrub.yaml

# A fixed name, so an edit to config.toml reloads the running registry in place
# instead of rolling the Deployment. The settings that do need a restart are
# listed at the top of config.toml.
configMapGenerator:
  - name: angos-config
    files:
      - config.toml
    options:
      disableNameSuffixHash: true
