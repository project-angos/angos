---
# The second `-c` file: every secret the registry reads, merged over config.toml
# at startup and watched, so rotating this Secret reloads in place with no
# restart. Nothing is read from the environment, by design.
#
# Fill it in and keep it out of git: seal it with kubeseal, or have an
# ExternalSecret render the same `secrets.toml` key. The placeholders are
# refused at startup, so an unfilled copy cannot serve.
#
# The signing key is 32 random bytes in base64, the password an Argon2 hash
# made with the image that runs the registry, never the password itself:
#   openssl rand -base64 32
#   docker run --rm -it ghcr.io/project-angos/angos:1.8.0 argon
apiVersion: v1
kind: Secret
metadata:
  name: angos-credentials
  namespace: angos
type: Opaque
stringData:
  secrets.toml: |
    [blob_store.s3]
    access_key_id = "CHANGE-ME"
    secret_key = "CHANGE-ME"

    [metadata_store.s3]
    access_key_id = "CHANGE-ME"
    secret_key = "CHANGE-ME"

    [auth.token_service]
    secret_key = "CHANGE-ME"

    [auth.identity.admin]
    username = "admin"
    password = "$argon2id$v=19$m=19456,t=2,p=1$CHANGE$ME"
