[package]
name = "angos-extension-service"
version = "0.1.0"
edition = "2024"

[features]
hyper = ["dep:angos-transport", "angos-oci-service/hyper"]

[dependencies]
angos-oci = { workspace = true }
angos-oci-service = { workspace = true, optional = true }
angos-transport = { workspace = true, optional = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_html_form = { workspace = true }
