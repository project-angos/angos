[package]
name = "angos-docker-extension-service"
version = "0.1.0"
edition = "2024"

[features]
hyper = ["dep:angos-transport", "dep:serde_json"]

[dependencies]
angos-oci = { workspace = true }
angos-transport = { workspace = true, optional = true }
async-trait = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_html_form = { workspace = true }
serde_json = { workspace = true, optional = true }
